<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Article Generator</title>

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
    padding:40px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
}

input{
    width:100%;
    padding:14px;
    font-size:16px;
}

button{
    margin-top:15px;
    padding:12px 20px;
    background:black;
    color:white;
    border:none;
    cursor:pointer;
}

#output{
    margin-top:30px;
    white-space:pre-wrap;
    line-height:1.7;
}

</style>
</head>

<body>

<div class="container">

<h1>AI Article Generator</h1>

<input
type="text"
id="topic"
placeholder="Enter article topic"
/>

<button onclick="generateArticle()">
Generate Article
</button>

<div id="output"></div>

</div>

<script>

async function generateArticle(){

    const topic =
      document.getElementById("topic").value;

    if(!topic){
        alert("Please enter topic");
        return;
    }

    document.getElementById("output")
      .innerHTML = "Generating article...";

    const response = await fetch(
      "https://hook.us2.make.com/22898jfmq57iygo9rpa3vnmgrjmtgf48",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body: JSON.stringify({ topic })
      }
    );

    const data = await response.json();

    document.getElementById("output")
      .innerHTML = data.article;
}

</script>

</body>
</html>
