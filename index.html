<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Article Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 { margin-bottom: 24px; font-size: 1.8rem; }
    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    button {
      margin-top: 12px;
      padding: 12px 24px;
      background: black;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #status {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
      display: none;
    }
    #error-box {
      margin-top: 20px;
      background: #fff0f0;
      border: 1px solid #ffcccc;
      border-radius: 6px;
      padding: 16px;
      color: #c0392b;
      font-size: 14px;
      display: none;
    }
    #output {
      margin-top: 24px;
      white-space: pre-wrap;
      line-height: 1.8;
      font-size: 15px;
      border-top: 1px solid #eee;
      padding-top: 24px;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>AI Article Generator</h1>

  <input
    type="text"
    id="topic"
    placeholder="Enter article topic e.g. Cyber Security"
  />

  <br/>
  <button id="btn" onclick="generateArticle()">Generate Article</button>

  <p id="status">⏳ Generating your article, please wait (10–20 sec)...</p>

  <div id="error-box"></div>

  <div id="output"></div>
</div>

<script>
  const WEBHOOK_URL = "https://hook.us2.make.com/22898jfmq57iygo9rpa3vnmgrjmtgf48";

  async function generateArticle() {
    const topic = document.getElementById("topic").value.trim();
    const btn = document.getElementById("btn");
    const status = document.getElementById("status");
    const errorBox = document.getElementById("error-box");
    const output = document.getElementById("output");

    // Validation
    if (!topic) {
      alert("Please enter a topic.");
      return;
    }

    // Reset UI
    errorBox.style.display = "none";
    output.style.display = "none";
    status.style.display = "block";
    btn.disabled = true;

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic })
      });

      // Log raw status for debugging
      console.log("HTTP Status:", response.status);

      const text = await response.text();
      console.log("Raw response:", text);

      // Try to parse JSON
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error("Make.com returned non-JSON response: " + text);
      }

      if (data.success && data.article) {
        output.textContent = data.article;
        output.style.display = "block";
      } else {
        throw new Error("Unexpected response: " + JSON.stringify(data));
      }

    } catch (err) {
      console.error("Error:", err);
      errorBox.innerHTML = `
        <strong>Error:</strong> ${err.message}<br><br>
        <small>Open browser Console (F12) for full details.</small>
      `;
      errorBox.style.display = "block";
    } finally {
      status.style.display = "none";
      btn.disabled = false;
    }
  }

  document.getElementById("topic").addEventListener("keypress", (e) => {
    if (e.key === "Enter") generateArticle();
  });
</script>

</body>
</html>
